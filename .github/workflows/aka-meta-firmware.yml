name: Firmware AKA depuis un jeu META
# Recompile un .bin Gamebuino META en firmware natif pour l'AKA (m0recomp --system meta --target aka),
# le compile avec PlatformIO et publie firmware.bin dans les artefacts.
# Actions > Firmware AKA depuis un jeu META > Run workflow.
on:
  workflow_dispatch:
    inputs:
      rom:
        description: "Chemin du .bin META dans le depot"
        type: string
        default: "tools/aka/samples/CatsAndCoinsDemo.bin"
      bgr:
        description: "Ordre des couleurs BGR de l'ecran (coche si rouge et bleu sont inverses)"
        type: boolean
        default: true
      iram:
        description: "Pages (1 Ko de code ARM chacune) les plus chaudes copiees en RAM interne, essayees de la plus grande valeur vers 0 jusqu'a ce que ca tienne"
        type: string
        default: "6"
      parties:
        description: "Parties aleatoires jouees pour decouvrir le code a traduire (plus = mieux couvert, plus long)"
        type: string
        default: "4"

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++
          python3 -m pip install platformio
      - name: Recompilateur
        run: |
          cmake -G Ninja -B build .
          ninja -C build m0recomp
      - name: Couverture (parties jouees sur PC)
        run: |
          rom="${{ inputs.rom }}"
          name="$(basename "$rom" .bin)"
          echo "NAME=$name" >> "$GITHUB_ENV"
          ./build/bin/m0recomp "$rom" --system meta --target pc -o "$RUNNER_TEMP/pc"
          cmake -G Ninja -S "$RUNNER_TEMP/pc" -B "$RUNNER_TEMP/pc/build"
          ninja -C "$RUNNER_TEMP/pc/build" m0_headless
          for seed in $(seq 1 ${{ inputs.parties }}); do
            "$RUNNER_TEMP/pc/build/m0_headless" --frames 3000 --random "$seed" --profile "$RUNNER_TEMP/p$seed" | tail -1
          done
          cat "$RUNNER_TEMP"/p*.cov | awk '{ if (!($1 in n)) n[$1]=0; n[$1]+=$2 } END { for (a in n) print a, n[a] }' | sort > "$RUNNER_TEMP/all.cov"
          wc -l "$RUNNER_TEMP/all.cov"
      - name: Projet AKA
        run: |
          ./build/bin/m0recomp "${{ inputs.rom }}" --system meta --target aka --coverage "$RUNNER_TEMP/all.cov" -o "$RUNNER_TEMP/aka"
          cat "$RUNNER_TEMP/aka/native-status.txt"
      - name: Pages chaudes en RAM interne
        run: |
          python3 - <<'PY'
          import re, glob, os, collections
          tmp = os.environ["RUNNER_TEMP"]
          pg = collections.Counter()
          for f in glob.glob(tmp + "/p*.hot"):
              for l in open(f):
                  m = re.match(r"([0-9a-f]+) cycles=(\d+)", l)
                  if m: pg[int(m.group(1), 16) >> 10] += int(m.group(2))
          order = [p for p, _ in pg.most_common()]
          open(tmp + "/hot_pages.txt", "w").write(" ".join("%x" % p for p in order))
          print("pages les plus chaudes :", " ".join("%x" % p for p in order[:12]))
          PY
      - name: Compilation PlatformIO
        working-directory: ${{ runner.temp }}/aka
        env:
          PLATFORMIO_BUILD_FLAGS: ${{ inputs.bgr && '-DAKA_LCD_BGR=1' || '' }}
        run: |
          read -r -a hot < "$RUNNER_TEMP/hot_pages.txt"
          n=${{ inputs.iram }}
          while true; do
            git -C . status >/dev/null 2>&1 || true
            # repart des sources d'origine a chaque essai
            rm -rf .iram_done
            for f in src/m0_native_page_*.c; do sed -i -E 's/^(IRAM_ATTR )+int m0_page_/int m0_page_/' "$f"; done
            for p in "${hot[@]:0:$n}"; do
              for f in src/m0_native_page_*.c; do
                sed -i -E "s/^int m0_page_${p}\(/IRAM_ATTR int m0_page_${p}(/" "$f"
              done
            done
            if [ "$n" -gt 0 ]; then sed -i '1i #include "esp_attr.h"' src/m0_native_page_*.c; fi
            echo "=== essai avec $n pages en RAM interne ==="
            if pio run > "$RUNNER_TEMP/build.log" 2>&1; then tail -n 25 "$RUNNER_TEMP/build.log"; break; fi
            # les erreurs, lisibles dans les annotations du run
            grep -E "error|undefined reference|overflow|will not fit|region" "$RUNNER_TEMP/build.log" | head -n 8 | while IFS= read -r l; do echo "::error::[n=$n] ${l:0:400}"; done
            [ "$n" -eq 0 ] && exit 1
            n=$(( n > 2 ? n - 2 : 0 ))
            for f in src/m0_native_page_*.c; do sed -i '1{/esp_attr.h/d}' "$f"; done
          done
      - name: Paquet
        run: |
          out="$RUNNER_TEMP/pack/$NAME"
          mkdir -p "$out"
          cd "$RUNNER_TEMP/aka/.pio/build/aka"
          cp firmware.bin bootloader.bin partitions.bin "$out/" 2>/dev/null || true
          cp "$RUNNER_TEMP/aka/aka.csv" "$out/"
          ls -la "$out"
          echo "PACK=$RUNNER_TEMP/pack" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-aka-${{ env.NAME }}
          path: ${{ env.PACK }}
